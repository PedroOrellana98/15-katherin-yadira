<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>15 Años de Katherin - ¡Te esperamos!</title>

    <meta property="og:url" content="https://pedroorellana98.github.io/15-katherin-yadira/">
    
    <meta property="og:type" content="website">
    
    <meta property="og:title" content="Cumpleaños de Katherin - ¡Te esperamos!">
    <meta property="og:description" content="Detalles del evento, ubicación y confirmación de asistencia.">
    
    <meta property="og:image" content="https://github.com/PedroOrellana98/15-katherin-yadira/blob/main/Invitacion-01.png">

    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    
    <link rel="stylesheet" href="style.css"> 
</head>
<body>

    <!-- Pantalla 1: Carátula -->
    <div id="caratula" class="full-screen-bg" onclick="iniciarExperiencia()">
        <div class="overlay"></div>
    </div>

    <!-- Pantalla 2: Invitación Detallada -->
    <div id="contenido" class="hidden">
        <div class="invitacion-container">
            <!-- Capas de imágenes según tus artes -->
            <img src="Invitacion-03.png" class="fondo-invitacion">
            
            <div class="elementos-overlay">
                <img src="Invitacion-04.png" class="header-mis15">
                <img src="Invitacion-05.png" class="padres-padrinos">
                <img src="Invitacion-06.png" class="nombre-quinceanera">
                <img src="Invitacion-07.png" class="fecha-lugar">
                
                <!-- Botón de Ubicación con Link Real -->
                <a href="https://maps.app.goo.gl/Cm7aBp3cwQT9ucbW6?g_st=ic" target="_blank" class="btn-ubicacion">
                    <img src="Invitacion-08.png" alt="Ubicación">
                </a>
                
            </div>
        </div>

        <!-- Control de Música Flotante -->
        <button onclick="controlMusica()" id="btn-musica">🎵</button>
    </div>

    <audio id="musica-fondo" loop>
        <source src="musica.mp3" type="audio/mpeg">
    </audio>

    <script src="script.js"></script>
</body>
</html>
